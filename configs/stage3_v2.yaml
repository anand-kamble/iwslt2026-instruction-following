# Stage 3: Multimodal merge (all tasks with audio)
# Following NAVER IWSLT 2025: 1K steps, effective batch 256,
# projector LR 1e-5, LoRA LR 3e-4 (30x ratio)
# H200 141GB: batch 16 × accum 8 = 128
defaults:
  - base

task: multitask
track: short
stage: 3

tasks:
  asr:
    train:
      - europarlst
    # - gigast  # uncomment after downloading GigaST
  s2tt:
    train:
      - europarlst
    target_languages:
      - de
      - it
      # - zh  # needs GigaST (EuroParlST has no EN→ZH)
  sqa:
    train:
      - librisqa
    languages:
      - en
  s2tsum:
    languages:
      - en
  achap:
    languages:
      - en
    use_audio: true     # ~68GB YTSeg audio config

data: {}

sampling:
  # Paper ratios: ASR 0.2 / ST 0.4 / SQA 0.4, scaled to include S2TSUM + ACHAP
  ratios:
    asr: 0.15
    s2tt_de: 0.15   
    s2tt_it: 0.15
    sqa_en: 0.30
    s2tsum_en: 0.10
    achap_en: 0.15

training:
  downsample_factor: 3
  num_epochs: 1
  per_device_train_batch_size: 8
  gradient_accumulation_steps: 4
  dataloader_num_workers: 2
  gradient_checkpointing: true
  learning_rate: 1e-5
  lr_projector: 1e-5
  lr_lora: 3e-4
  # lr_lora: 2e-4
  weight_decay: 0.1
  warmup_ratio: 0.0
  lr_scheduler_type: cosine
  lr_scheduler_projector: constant
  save_steps: 100
  logging_steps: 10
  logging_dir: ./logs/stage3
