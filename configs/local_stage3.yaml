# Local Stage 3: Multimodal merge with 20 samples
defaults:
  - base

task: multitask
track: short
stage: 3

tasks:
  asr:
    train:
      - europarlst

data:
  max_samples: 20

sampling:
  temperature: 0.5

training:
  downsample_factor: 3
  num_epochs: 1
  per_device_train_batch_size: 2
  gradient_accumulation_steps: 1
  gradient_checkpointing: false
  learning_rate: 1e-5
  lr_projector: 5e-5
  lr_lora: 1e-4
  warmup_ratio: 0.0
  save_steps: 9999
  logging_steps: 1
  dataloader_num_workers: 0
  optim: adamw_torch

hub:
  push_to_hub: false

paths:
  output_dir: ./outputs/local
