# Local Stage 3: Multimodal merge with 20 samples
defaults:
  - base

task: multitask
track: short
stage: 3

tasks:
  asr:
    train:
      - europarlst
  s2tt:
    train:
      - europarlst
    target_languages:
      - de
      - it
  sqa:
    train:
      - librisqa
    languages:
      - en
  s2tsum:
    languages:
      - en
  achap:
    languages:
      - en
    use_audio: true

data:
  max_samples: 20

sampling:
  ratios:
    asr: 0.15
    s2tt_de: 0.15
    s2tt_it: 0.15
    sqa_en: 0.30
    s2tsum_en: 0.10
    achap_en: 0.15

training:
  downsample_factor: 3
  num_epochs: 1
  per_device_train_batch_size: 2
  gradient_accumulation_steps: 1
  gradient_checkpointing: false
  learning_rate: 1e-5
  lr_projector: 1e-5
  lr_lora: 3e-4
  warmup_ratio: 0.0
  save_steps: 9999
  logging_steps: 1
  dataloader_num_workers: 0
  optim: adamw_torch

hub:
  push_to_hub: false

paths:
  output_dir: ./outputs/local
