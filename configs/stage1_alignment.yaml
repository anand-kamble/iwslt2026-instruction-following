# Stage 1: Projector alignment on ASR (no LoRA, LLM frozen)
# Following NAVER IWSLT 2025: constant LR, large effective batch (16×16=256)
defaults:
  - base

task: asr
language: en
stage: 1

data:
  train:
    - europarlst
    # - gigast  # uncomment after downloading GigaST translations
  eval:
    - mcif
  max_samples: 30000

training:
  no_lora: true
  downsample_factor: 3
  num_epochs: 4
  per_device_train_batch_size: 16
  gradient_accumulation_steps: 16
  gradient_checkpointing: true
  learning_rate: 1e-4
  lr_scheduler_type: constant
  warmup_ratio: 0.0
  logging_steps: 10
  logging_dir: ./logs/stage1
  save_steps: 500
