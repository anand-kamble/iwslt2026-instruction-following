# Stage 1: Projector alignment on ASR + ST (NAVER Stage A.1)
# No LoRA, LLM frozen — only projector trains.
# Paper §5.1: constant LR 1e-4, 4 epochs, AdamW, grad accum 16.
# ASR data: CoVoST2 (0.8) + EuroParlST (0.2) — natural size ratio approximates this.
# ST language probs: en-de 0.3, en-zh 0.4, en-it 0.3.
# Best checkpoint selected by average ST on ACL 60-60 dev.
defaults:
  - base

task: multitask
stage: 1

tasks:
  asr:
    train:
      - covost2
      - europarlst
  s2tt:
    train:
      - covost2
      - europarlst
    target_languages:
      - de
      - it
      - zh

data:
  eval:
    - mcif

sampling:
  # Paper §5.1 A.1: ASR ~0.4, ST ~0.6
  # ST split by language: en-de 0.3, en-zh 0.4, en-it 0.3
  # => s2tt_de = 0.6*0.3 = 0.18, s2tt_zh = 0.6*0.4 = 0.24, s2tt_it = 0.6*0.3 = 0.18
  ratios:
    asr: 0.40
    s2tt_de: 0.18
    s2tt_zh: 0.24
    s2tt_it: 0.18

training:
  no_lora: true
  downsample_factor: 3
  num_epochs: 4
  per_device_train_batch_size: 64
  gradient_accumulation_steps: 4
  gradient_checkpointing: true
  learning_rate: 1e-4
  lr_scheduler_type: constant
  warmup_ratio: 0.0
  logging_steps: 10
  save_steps: 500
  logging_dir: ./logs/stage1
