# Stage 1: Projector alignment on ASR + ST (NAVER Stage A)
# No LoRA, LLM frozen — only projector trains.
# Following NAVER IWSLT 2025 (arxiv 2506.01808): constant LR 1e-4,
# effective batch 256, ASR 0.4 / ST 0.6
# H200 141GB: batch 64 × accum 4 = 256
defaults:
  - base

task: multitask
stage: 1

tasks:
  asr:
    train:
      - europarlst
  s2tt:
    train:
      - europarlst
    target_languages:
      - de
      - it

data:
  eval:
    - mcif

sampling:
  # NAVER Stage A ratios: ASR 0.4, ST 0.6 (split equally across languages)
  ratios:
    asr: 0.4
    s2tt_de: 0.3
    s2tt_it: 0.3

training:
  no_lora: true
  downsample_factor: 3
  num_epochs: 4
  per_device_train_batch_size: 64
  gradient_accumulation_steps: 4
  gradient_checkpointing: true
  learning_rate: 1e-4
  lr_scheduler_type: constant
  warmup_ratio: 0.0
  logging_steps: 10
  save_steps: 500
  logging_dir: ./logs/stage1
