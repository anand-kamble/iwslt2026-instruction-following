# Stage 1: Projector alignment on ASR (no LoRA, LLM frozen)
# H200: larger batch, more data, proper warmup
defaults:
  - base

task: asr
language: en
stage: 1

data:
  train:
    - europarlst
    # - gigast  # uncomment after downloading GigaST translations
  eval:
    - mcif
  max_samples: 30000

training:
  no_lora: true
  downsample_factor: 3
  num_epochs: 5
  per_device_train_batch_size: 16
  gradient_accumulation_steps: 2
  gradient_checkpointing: false
  learning_rate: 5e-4
  warmup_ratio: 0.05
  logging_steps: 10
  logging_dir: ./logs/stage1
  save_steps: 500
