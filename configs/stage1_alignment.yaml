# Stage 1: Projector alignment on ASR (no LoRA)
defaults:
  - base

task: asr
language: en
stage: 1

data:
  train:
    - europarlst
    # - gigast  # uncomment after downloading GigaST translations
  eval:
    - mcif
  max_samples: 1000  # 1K English samples in streaming mode to avoid OOM
training:
  no_lora: true
  downsample_factor: 3
  num_epochs: 3
  per_device_train_batch_size: 1
  gradient_accumulation_steps: 8
  gradient_checkpointing: false
  learning_rate: 1e-4
  logging_steps: 10
  logging_dir: ./logs/stage1
  save_steps: 200
