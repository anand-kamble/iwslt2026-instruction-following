# Speech-to-Text Translation task configuration (H200)
defaults:
  - base

task: s2tt
source_language: en
target_languages:
  - de
  - it
  - zh

data:
  train:
    - europarlst
    - gigast
  eval:
    - mcif

training:
  num_epochs: 3
  per_device_train_batch_size: 8
  gradient_accumulation_steps: 2
  learning_rate: 2e-5
  warmup_ratio: 0.05
