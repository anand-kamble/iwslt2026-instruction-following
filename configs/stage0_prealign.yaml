# Stage 0: MSE pre-alignment (projector only, no LLM in loop)
# Trains projector to map speech features → LLM embedding space
# ~2-3 GB memory, ~50-100x faster than Stage 1

training:
  projector_type: transformer
  batch_size: 16
  learning_rate: 1e-3
  weight_decay: 0.01
  num_epochs: 10
  logging_steps: 10
  save_steps: 100
  output_dir: outputs/stage0_prealign
