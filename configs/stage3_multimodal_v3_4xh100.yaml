# Stage 3 v3 (4x H100): Multimodal merge using Stage 2 v3 LoRA adapter.
# LoRA params match Stage 2 v3 (rank 32, alpha 64, dropout 0.05, all-linear, lr 2e-4).
# Output: outputs/stage3_multimodal_v3_4xh100/
defaults:
  - base

task: multitask
track: short
stage: 3

tasks:
  asr:
    train:
      - covost2
      - europarlst
  s2tt:
    train:
      - covost2
      - europarlst
    target_languages:
      - de
      - it
      - zh
  sqa:
    train:
      - librisqa
    languages:
      - en
      - de
      - it
      - zh
  s2tsum:
    languages:
      - en
  achap:
    languages:
      - en
    use_audio: true

data: {}

text_interleave:
  s2tt_de: mt_de
  s2tt_it: mt_it
  s2tt_zh: mt_zh
  sqa_en: qa_en
  sqa_de: qa_de
  sqa_it: qa_it
  sqa_zh: qa_zh

sampling:
  ratios:
    asr: 0.20
    s2tt_de: 0.10
    s2tt_it: 0.10
    s2tt_zh: 0.10
    sqa_en: 0.10
    sqa_de: 0.05
    sqa_it: 0.05
    sqa_zh: 0.05
    s2tsum_en: 0.10
    achap_en: 0.15

training:
  downsample_factor: 3
  max_steps: 3000

  # 4x H100 target: keep global batch at 256.
  per_device_train_batch_size: 8
  gradient_accumulation_steps: 8

  dataloader_num_workers: 4
  dataloader_persistent_workers: true
  gradient_checkpointing: true

  learning_rate: 1e-5
  lr_projector: 1e-5
  lr_lora: 2e-4
  weight_decay: 0.1
  warmup_ratio: 0.03
  lr_scheduler_type: cosine
  lr_scheduler_projector: constant
  save_steps: 300
  logging_steps: 10
  logging_dir: ./logs/stage3_multimodal_v3_4xh100

  ddp_find_unused_parameters: true

  # LoRA hyperparameters — must match Stage 2 v3 adapter
  lora_r: 32
  lora_alpha: 64
  lora_dropout: 0.05
  lora_target_modules: all-linear
