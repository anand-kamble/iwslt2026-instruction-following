# Multi-task config for LONG track
# All short track tasks + S2TSUM + ACHAP
# Long-form audio (~6 min) requires higher max_seq_length
# H200 optimized
defaults:
  - base

task: multitask
track: long

tasks:
  asr:
    train:
      - europarlst
      - gigast
  s2tt:
    train:
      - europarlst
      - gigast
    target_languages:
      - de
      - it
      - zh
  sqa:
    train:
      - librisqa
    languages:
      - en
      - de
      - it
      - zh
  s2tsum:
    train:
      - nutshell
    languages:
      - en
      - de
      - it
      - zh
  achap:
    train:
      - ytseg
    languages:
      - en
      - de
      - it
      - zh

sampling:
  temperature: 0.5

training:
  num_epochs: 3
  per_device_train_batch_size: 4
  gradient_accumulation_steps: 4
  learning_rate: 1e-5
  warmup_ratio: 0.05
  max_seq_length: 8192
