# Spoken Question Answering task configuration (H200)
defaults:
  - base

task: sqa
languages:
  - en
  - de
  - it
  - zh

data:
  train:
    - librisqa
  eval:
    - mcif

training:
  num_epochs: 5
  per_device_train_batch_size: 8
  gradient_accumulation_steps: 2
  learning_rate: 2e-5
  warmup_ratio: 0.05

# Unanswerable response strings per language
unanswerable_responses:
  en: "Not answerable."
  it: "Non è possibile rispondere."
  de: "Nicht zu beantworten."
  zh: "无法回答。"
