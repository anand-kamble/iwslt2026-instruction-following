# Audio Chaptering task configuration (H200)
defaults:
  - base

task: achap
languages:
  - en
  - de
  - it
  - zh

data:
  train:
    - ytseg
  eval:
    - ytseg

training:
  num_epochs: 5
  per_device_train_batch_size: 4
  gradient_accumulation_steps: 4
  learning_rate: 1e-5
  warmup_ratio: 0.05
  max_seq_length: 8192
