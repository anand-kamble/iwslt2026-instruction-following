# Stage 2: Text-only LoRA pre-training (MT + SQA, no audio)
defaults:
  - base

task: text_lora
stage: 2

data:
  train:
    - mt_europarlst
    # - mt_gigast  # uncomment after downloading GigaST translations
    # - sqa_translated  # uncomment after running translate_sqa.py
    # - sqa_english  # uncomment after fixing LibriSQA schema

training:
  text_only: true
  gradient_checkpointing: false
  num_epochs: 1
  per_device_train_batch_size: 1
  gradient_accumulation_steps: 8
  learning_rate: 3e-4
  downsample_factor: 3
  max_steps: 500  # brief text LoRA training (NAVER's Stage B was short)
  logging_steps: 10
  save_steps: 200
  logging_dir: ./logs/stage2
