# Stage 2: Text-only LoRA pre-training (MT + SQA, no audio)
# Following NAVER IWSLT 2025: warmup 100 steps, weight_decay 0.1
defaults:
  - base

task: text_lora
stage: 2

data:
  train:
    - mt_europarlst
    # - mt_gigast  # uncomment after downloading GigaST translations
    # - sqa_translated  # uncomment after running translate_sqa.py
    # - sqa_english  # uncomment after fixing LibriSQA schema

training:
  text_only: true
  gradient_checkpointing: false
  num_epochs: 1
  per_device_train_batch_size: 10
  gradient_accumulation_steps: 8
  learning_rate: 3e-4
  weight_decay: 0.1
  downsample_factor: 3
  warmup_steps: 100
  warmup_ratio: 0.0
  logging_steps: 10
  save_steps: 500
  logging_dir: ./logs/stage2
