# Stage 2: Text-only LoRA pre-training (MT + SQA, no audio)
defaults:
  - base

task: text_lora
stage: 2

data:
  train:
    - mt_europarlst
    - mt_gigast
    - sqa_translated
    - sqa_english

training:
  text_only: true
  num_epochs: 2
  per_device_train_batch_size: 8
  learning_rate: 3e-4
  downsample_factor: 3
