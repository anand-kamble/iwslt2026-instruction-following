# Stage 2: Text-only LoRA pre-training (MT + SQA, no audio)
# Following NAVER IWSLT 2025: warmup 100 steps, weight_decay 0.1,
# MT 0.6 / QA 0.4 sampling (Table 13)
# H200 141GB: batch 40 × accum 2 = 80 (maximizes GPU utilization)
defaults:
  - base

task: text_lora
stage: 2

data:
  train:
    - mt_europarlst
    - sqa_english
    # - mt_gigast  # uncomment after downloading GigaST translations
    # - sqa_translated  # uncomment after running translate_sqa.py

# NAVER Stage B sampling (Table 13): MT 0.6, QA 0.4
# Sub-ratios within MT/QA split evenly across available languages.
sampling:
  ratios:
    mt_de: 0.30
    mt_it: 0.30
    qa_en: 0.40
    # mt_zh: 0.15  # uncomment with mt_gigast
    # qa_de: 0.10  # uncomment with sqa_translated
    # qa_it: 0.10  # uncomment with sqa_translated
    # qa_zh: 0.10  # uncomment with sqa_translated

training:
  text_only: true
  gradient_checkpointing: false
  num_epochs: 1
  per_device_train_batch_size: 40
  gradient_accumulation_steps: 2
  learning_rate: 3e-4
  weight_decay: 0.1
  downsample_factor: 3
  warmup_steps: 100
  warmup_ratio: 0.0
  logging_steps: 10
  save_steps: 500
  logging_dir: ./logs/stage2
