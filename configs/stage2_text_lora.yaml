# Stage 2: Text-only LoRA pre-training (MT + SQA, no audio)
# H200: larger batch, more steps for convergence
defaults:
  - base

task: text_lora
stage: 2

data:
  train:
    - mt_europarlst
    # - mt_gigast  # uncomment after downloading GigaST translations
    # - sqa_translated  # uncomment after running translate_sqa.py
    # - sqa_english  # uncomment after fixing LibriSQA schema

training:
  text_only: true
  gradient_checkpointing: false
  num_epochs: 2
  per_device_train_batch_size: 32
  gradient_accumulation_steps: 1
  learning_rate: 3e-4
  downsample_factor: 3
  max_steps: 2000
  warmup_ratio: 0.05
  logging_steps: 10
  save_steps: 500
  logging_dir: ./logs/stage2
