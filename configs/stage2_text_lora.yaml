# Stage 2: Text-only LoRA pre-training (MT + QA, no audio)
# Paper §5.1 Stage B: 1 epoch, LR 3e-4, weight_decay 0.1, warmup 100 steps.
# MT 0.6 / QA 0.4 sampling. Last checkpoint selected.
# H200 141GB: batch 40 x accum 2 = 80 (matches paper effective batch of 80)
defaults:
  - base

task: text_lora
stage: 2

data:
  train:
    - mt_europarlst
    - mt_covost2
    - sqa_english
    - sqa_translated

# Paper §5.1 Stage B: MT 0.6, QA 0.4
# MT split evenly across 3 languages. QA split across 4 languages.
sampling:
  ratios:
    mt_de: 0.20
    mt_it: 0.20
    mt_zh: 0.20
    qa_en: 0.10
    qa_de: 0.10
    qa_it: 0.10
    qa_zh: 0.10

training:
  text_only: true
  gradient_checkpointing: false
  num_epochs: 1
  per_device_train_batch_size: 40
  gradient_accumulation_steps: 2
  learning_rate: 3e-4
  weight_decay: 0.1
  warmup_steps: 100
  warmup_ratio: 0.0
  logging_steps: 10
  save_steps: 500
  logging_dir: ./logs/stage2
