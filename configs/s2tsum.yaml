# Speech-to-Text Summarization task configuration (H200)
defaults:
  - base

task: s2tsum
language: en

data:
  train:
    - nutshell
  eval:
    - mcif

training:
  num_epochs: 5
  per_device_train_batch_size: 4
  gradient_accumulation_steps: 4
  learning_rate: 1e-5
  warmup_ratio: 0.05
  max_seq_length: 8192
