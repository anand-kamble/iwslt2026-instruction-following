# Stage 3: Multimodal merge (all tasks with audio)
# Following NAVER IWSLT 2025: 1K steps, effective batch 256,
# projector LR 1e-5, LoRA LR 3e-4 (30x ratio)
# H200 141GB: batch 64 × accum 4 = 256 (maximizes GPU utilization)
defaults:
  - base

task: multitask
track: short
stage: 3

tasks:
  asr:
    train:
      - europarlst
    # - gigast  # uncomment after downloading GigaST
  s2tt:
    train:
      - europarlst
    target_languages:
      - de
      - it
      # - zh  # needs GigaST (EuroParlST has no EN→ZH)
  # sqa:  # needs LibriSpeech audio in data/LibriSpeech/
  #   train:
  #     - librisqa
  #   languages:
  #     - en
  s2tsum:
    languages:
      - en
  achap:
    languages:
      - en
    use_audio: true     # ~68GB YTSeg audio config

data: {}

sampling:
  temperature: 0.5

training:
  downsample_factor: 3
  max_steps: 1000
  per_device_train_batch_size: 4
  gradient_accumulation_steps: 64
  dataloader_num_workers: 2
  gradient_checkpointing: true
  learning_rate: 1e-5
  lr_projector: 1e-5
  lr_lora: 3e-4
  warmup_ratio: 0.0
  save_steps: 500
  logging_steps: 10
  logging_dir: ./logs/stage3
