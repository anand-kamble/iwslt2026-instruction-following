# Stage 3: Multimodal merge (all tasks with audio, brief training)
defaults:
  - base

task: multitask
track: short
stage: 3

tasks:
  asr:
    train:
      - europarlst
    # - gigast  # uncomment after downloading GigaST
  # s2tt:  # uncomment after all datasets are ready
  #   train:
  #     - europarlst
  #   target_languages:
  #     - de
  #     - it
  # sqa:  # uncomment after translated SQA is ready
  #   train:
  #     - librisqa
  #   languages:
  #     - en

data:
  max_samples: 1000  # limit for Mac memory

sampling:
  temperature: 0.5

training:
  downsample_factor: 3
  max_steps: 200  # brief merge (NAVER's Stage C was ~1K steps)
  per_device_train_batch_size: 1
  gradient_accumulation_steps: 8
  gradient_checkpointing: true
  learning_rate: 1e-5
  lr_projector: 1e-5
  lr_lora: 1e-4
  warmup_steps: 20
  save_steps: 100
  logging_steps: 5
  logging_dir: ./logs/stage3
