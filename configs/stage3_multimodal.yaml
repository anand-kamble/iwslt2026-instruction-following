# Stage 3: Multimodal merge (all tasks with audio)
# H200: more steps, proper warmup, larger batch
defaults:
  - base

task: multitask
track: short
stage: 3

tasks:
  asr:
    train:
      - europarlst
    # - gigast  # uncomment after downloading GigaST
  # s2tt:  # uncomment after all datasets are ready
  #   train:
  #     - europarlst
  #   target_languages:
  #     - de
  #     - it
  # sqa:  # uncomment after translated SQA is ready
  #   train:
  #     - librisqa
  #   languages:
  #     - en

data:
  max_samples: 30000

sampling:
  temperature: 0.5

training:
  downsample_factor: 3
  max_steps: 2000
  per_device_train_batch_size: 8
  gradient_accumulation_steps: 2
  gradient_checkpointing: true
  learning_rate: 1e-5
  lr_projector: 5e-5
  lr_lora: 1e-4
  warmup_ratio: 0.05
  save_steps: 500
  logging_steps: 10
  logging_dir: ./logs/stage3
