# Stage 3: Multimodal merge (all tasks with audio)
# Following NAVER IWSLT 2025 (arxiv 2506.01808): 1K steps, effective batch 256,
# projector LR 1e-5, LoRA LR 3e-4 (30x ratio)
# H200 141GB: batch 16 × accum 16 = 256 (matches NAVER)
defaults:
  - base

task: multitask
track: short
stage: 3

tasks:
  asr:
    train:
      - europarlst
    # - gigast  # uncomment after downloading GigaST
  s2tt:
    train:
      - europarlst
    target_languages:
      - de
      - it
      # - zh  # needs GigaST (EuroParlST has no EN→ZH)
  sqa:
    train:
      - librisqa
    languages:
      - en
  s2tsum:
    languages:
      - en
  achap:
    languages:
      - en
    use_audio: true     # ~68GB YTSeg audio config

data: {}

# Text-only interleaving (NAVER IWSLT 2025 Stage C):
# "Each time we sample a task that has a textual equivalent,
#  we also sample a batch from the corresponding textual task."
# Maps speech task → text equivalent (loader spec: mt_LANG or qa_LANG).
# The sampler pairs each speech batch with a text batch from the equivalent.
text_interleave:
  s2tt_de: mt_de
  s2tt_it: mt_it
  sqa_en: qa_en

sampling:
  # NAVER Stage C (Table 13): only speech tasks have ratios.
  # Text equivalents (MT, QA) piggyback via text_interleave pairing —
  # each speech batch with a text pair is followed by a text batch.
  # Base ratios (ASR 0.2, ST 0.4, SQA 0.4) adapted for S2TSUM + ACHAP.
  ratios:
    asr: 0.20
    s2tt_de: 0.15
    s2tt_it: 0.15
    sqa_en: 0.25
    s2tsum_en: 0.10
    achap_en: 0.15

training:
  downsample_factor: 3
  max_steps: 1000
  per_device_train_batch_size: 16
  gradient_accumulation_steps: 16
  dataloader_num_workers: 2
  gradient_checkpointing: true
  learning_rate: 1e-5
  lr_projector: 1e-5
  lr_lora: 3e-4
  weight_decay: 0.1
  warmup_ratio: 0.03
  lr_scheduler_type: cosine
  lr_scheduler_projector: constant
  save_steps: 100
  logging_steps: 10
  logging_dir: ./logs/stage3_multimodal
