# Stage 3: Multimodal merge (all tasks with audio, brief training)
defaults:
  - base

task: multitask
track: short
stage: 3

tasks:
  asr:
    train:
      - europarlst
      - gigast
  s2tt:
    train:
      - europarlst
      - gigast
    target_languages:
      - de
      - it
      - zh
  sqa:
    train:
      - librisqa
    languages:
      - en
      - de
      - it
      - zh

sampling:
  temperature: 0.5

training:
  downsample_factor: 3
  max_steps: 2000
  per_device_train_batch_size: 4
  gradient_accumulation_steps: 8
  learning_rate: 1e-5
  lr_projector: 1e-5
  lr_lora: 1e-4
  warmup_steps: 50
  save_steps: 500
  logging_steps: 10
