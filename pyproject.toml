[project]
name = "iwslt2026-instruction-following"
version = "0.1.0"
description = "IWSLT 2026 Instruction Following shared task — constrained setting"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.1",
    "torchaudio",
    "transformers>=4.46",
    "datasets",
    "huggingface_hub",
    "pyyaml",
    "tqdm",
    "peft",
    "trl",
    "accelerate",
    "bitsandbytes",
    "mcif-bench",
    "soundfile",
]

[project.optional-dependencies]
unsloth = [
    "unsloth",
]
eval = [
    "jiwer>=3.0",
    "bert_score",
    "unbabel-comet",
]
dev = [
    "pytest",
    "ruff",
    "ipykernel",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]
